<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Travel Plan">
<title>Travel Plan</title>
<style>
  :root {
    --bg: #f4f2ee; --card: #ffffff; --ink: #1d1d1f; --muted: #6e6e73;
    --line: #e2dfd8; --accent: #0a7c6e; --accent-ink: #ffffff; --danger: #c0392b;
    --tag-m: #e8a33d; --tag-a: #2f80c4; --tag-e: #7b4fb5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111214; --card: #1c1d20; --ink: #f2f2f4; --muted: #9a9aa1;
      --line: #2c2d31; --accent: #2bb3a0; --accent-ink: #06201c; --danger: #ff6b5b;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
  }
  main { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 28px; margin: 8px 0 16px; letter-spacing: -0.02em; }
  label.small { display: block; font-size: 13px; color: var(--muted); margin: 0 0 6px 2px; text-transform: uppercase; letter-spacing: .05em; }
  input, textarea, select {
    width: 100%; font: inherit; font-size: 17px; color: var(--ink);
    background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px;
  }
  textarea { resize: vertical; min-height: 48px; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  .section { margin-bottom: 18px; }
  button {
    font: inherit; font-size: 16px; font-weight: 600; border: 0; border-radius: 12px;
    padding: 12px 14px; cursor: pointer; background: var(--line); color: var(--ink);
  }
  button.primary { background: var(--accent); color: var(--accent-ink); }
  button:disabled { opacity: .5; }
  ol#list { list-style: none; padding: 0; margin: 0; }
  li.place {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 12px; margin-bottom: 10px; display: flex; gap: 10px; align-items: flex-start;
  }
  .num {
    flex: 0 0 28px; height: 28px; border-radius: 50%; background: var(--accent); color: var(--accent-ink);
    display: grid; place-items: center; font-weight: 700; font-size: 14px; margin-top: 2px;
  }
  .body { flex: 1; min-width: 0; }
  .name { font-weight: 600; font-size: 17px; word-wrap: break-word; }
  .tag { font-size: 12px; font-weight: 700; letter-spacing: .08em; margin-top: 2px; }
  .tag.MORNING { color: var(--tag-m); } .tag.AFTERNOON { color: var(--tag-a); } .tag.EVENING { color: var(--tag-e); }
  .desc { color: var(--muted); font-size: 15px; margin-top: 2px; }
  .desc a { color: var(--accent); text-decoration: none; }
  .ctrls { display: flex; flex-direction: column; gap: 4px; }
  .ctrls button { padding: 6px 10px; font-size: 15px; min-width: 40px; }
  .ctrls button.del { color: var(--danger); }
  .empty { color: var(--muted); text-align: center; padding: 20px 0; }
  .actions { position: sticky; bottom: 0; padding-top: 10px; background: linear-gradient(transparent, var(--bg) 30%); }
  .status { font-size: 14px; color: var(--muted); min-height: 20px; margin: 6px 2px; }
  .seg { display: flex; background: var(--line); border-radius: 12px; padding: 3px; gap: 3px; }
  .seg button { flex: 1; background: transparent; padding: 9px 8px; font-size: 15px; }
  .seg button.on { background: var(--card); box-shadow: 0 1px 3px rgba(0,0,0,.15); }
  li.leg { margin: -4px 0 10px 24px; padding: 10px 12px; border-left: 3px solid var(--accent); background: var(--card); border-radius: 0 12px 12px 0; }
  .leghead { font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 4px; }
  .opt { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 0; border-top: 1px solid var(--line); }
  .opt:first-of-type { border-top: 0; }
  .optname { font-weight: 600; }
  .price { font-weight: 600; text-align: right; font-size: 15px; white-space: pre; }
  li.place.compact { align-items: center; }
  li.place.compact .ctrls { flex-direction: row; }
  .badge { font-size: 11px; font-weight: 700; margin-left: 6px; padding: 2px 6px; border-radius: 6px; background: var(--accent); color: var(--accent-ink); vertical-align: 2px; }
  .links { margin-top: 6px; }
  .links a { color: var(--accent); text-decoration: none; font-weight: 600; }
  .fine { font-size: 12px; color: var(--muted); margin-top: 4px; }
  [hidden] { display: none !important; }
  dialog { border: 0; border-radius: 16px; background: var(--card); color: var(--ink); padding: 20px; width: min(92vw, 380px); }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  dialog h2 { margin: 0 0 12px; font-size: 20px; }
  dialog .stack { display: flex; flex-direction: column; gap: 10px; }
</style>
</head>
<body>
<main>
  <h1>Travel Plan <span id="ver" style="font-size:13px;font-weight:500;color:var(--muted);letter-spacing:0"></span></h1>

  <div class="seg section" role="group" aria-label="Trip type">
    <button id="segCity" class="on">Inside a city</button>
    <button id="segTrip">Between cities</button>
  </div>

  <div class="section" id="citySec">
    <label class="small" for="city">City</label>
    <input id="city" placeholder="e.g. Tokyo" autocomplete="off">
  </div>

  <div class="section">
    <label class="small" for="newPlace" id="addLbl">Add places (one per line)</label>
    <textarea id="newPlace" rows="2" placeholder="Ueno Park&#10;Senso-ji"></textarea>
    <div class="row" style="margin-top:8px">
      <button id="addBtn">Add</button>
      <button id="clearBtn">Clear list</button>
    </div>
  </div>

  <ol id="list"></ol>

  <div class="actions">
    <div class="status" id="status"></div>
    <div class="row">
      <button class="primary" id="startBtn">Start</button>
      <button class="primary" id="mapBtn">To map</button>
    </div>
  </div>
</main>

<dialog id="mapDlg">
  <h2>Open route in…</h2>
  <div class="stack">
    <label class="small" for="mode">Travel mode</label>
    <select id="mode">
      <option value="walking">Walking</option>
      <option value="driving">Driving</option>
      <option value="transit">Transit (start + end only)</option>
    </select>
    <div id="legBox" class="stack" hidden>
      <label class="small" for="legSel">Route</label>
      <select id="legSel"></select>
      <div class="fine" id="legHint"></div>
    </div>
    <button class="primary" id="gBtn">Google Maps</button>
    <button class="primary" id="aBtn">Apple Maps</button>
    <button id="cancelBtn">Cancel</button>
  </div>
</dialog>

<script>
const APP_VERSION = "1.5.0";
const KEY = "travelplan.v1";
const $ = (id) => document.getElementById(id);

// mode "city": places inside one city. mode "trip": travel between cities.
let state = { mode: "city", city: "", places: [], cities: [], legs: {} };
const isTrip = () => state.mode === "trip";
const list = () => (isTrip() ? state.cities : state.places);

function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && Array.isArray(s.places)) state = Object.assign(state, s);
  } catch (e) {}
  if (!Array.isArray(state.cities)) state.cities = [];
  if (!state.legs) state.legs = {};
}
function applyMode() {
  $("segCity").classList.toggle("on", !isTrip());
  $("segTrip").classList.toggle("on", isTrip());
  $("citySec").hidden = isTrip();
  $("addLbl").textContent = isTrip() ? "Add cities (one per line)" : "Add places (one per line)";
  $("newPlace").placeholder = isTrip() ? "Tokyo\nKyoto\nOsaka" : "Ueno Park\nSenso-ji";
  setStatus("");
  render();
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
}
function setStatus(t) { $("status").textContent = t; }

// MORNING / AFTERNOON / EVENING by position in the list (split in thirds).
function timeTag(i, n) {
  if (n <= 1) return "MORNING";
  const f = i / n;
  return f < 1/3 ? "MORNING" : f < 2/3 ? "AFTERNOON" : "EVENING";
}

function render() {
  const ol = $("list");
  ol.innerHTML = "";
  const n = list().length;
  if (!n) { ol.innerHTML = `<li class="empty">No ${isTrip() ? "cities" : "places"} yet.</li>`; return; }
  list().forEach((p, i) => {
    const li = document.createElement("li");
    li.className = isTrip() ? "place compact" : "place";
    const num = document.createElement("div"); num.className = "num"; num.textContent = i + 1;
    const body = document.createElement("div"); body.className = "body";
    const name = document.createElement("div"); name.className = "name"; name.textContent = p.name;
    body.appendChild(name);
    if (!isTrip() && p.desc !== undefined) {
      const tag = timeTag(i, n);
      const t = document.createElement("div"); t.className = "tag " + tag; t.textContent = tag;
      const d = document.createElement("div"); d.className = "desc"; d.textContent = p.desc || "No description found.";
      if (p.url) {
        const a = document.createElement("a"); a.href = p.url; a.target = "_blank"; a.rel = "noopener"; a.textContent = " More";
        d.appendChild(a);
      }
      body.append(t, d);
    }
    const c = document.createElement("div"); c.className = "ctrls";
    const up = btn("▲", "Move up", () => move(i, -1)); up.disabled = i === 0;
    const dn = btn("▼", "Move down", () => move(i, 1)); dn.disabled = i === n - 1;
    const del = btn("✕", "Remove", () => { list().splice(i, 1); save(); render(); }); del.className = "del";
    c.append(up, dn, del);
    li.append(num, body, c);
    ol.appendChild(li);
    if (isTrip() && i < n - 1) {
      const leg = state.legs[legKey(p, list()[i + 1])];
      if (leg) ol.appendChild(renderLeg(leg));
    }
  });
}

// ---- Between cities: one card per leg ----
const ICON = { metro: "🚇", train: "🚆", hsr: "🚄", bus: "🚌" };
function renderLeg(leg) {
  const li = document.createElement("li");
  li.className = "leg";
  const h = document.createElement("div"); h.className = "leghead";
  h.textContent = `${leg.from} → ${leg.to}` + (leg.km ? ` · about ${Math.round(leg.km)} km` : "");
  li.appendChild(h);
  if (leg.error) {
    const e = document.createElement("div"); e.className = "desc"; e.textContent = leg.error; li.appendChild(e);
  }
  const opts = leg.options || [];
  const fastest = opts.length ? Math.min(...opts.map(o => o.min)) : 0;
  const cheapest = opts.length ? Math.min(...opts.map(o => o.usd)) : 0;
  opts.forEach(o => {
    const r = document.createElement("div"); r.className = "opt";
    const l = document.createElement("div"); l.className = "optl";
    const t = document.createElement("div"); t.className = "optname"; t.textContent = `${ICON[o.kind]} ${o.label}`;
    if (o.min === fastest) t.appendChild(badge("Fastest"));
    if (o.usd === cheapest) t.appendChild(badge("Cheapest"));
    const s = document.createElement("div"); s.className = "desc"; s.textContent = fmtTime(o.min);
    l.append(t, s);
    const p = document.createElement("div"); p.className = "price"; p.textContent = fmtPrice(o.usd, leg.cur);
    r.append(l, p);
    li.appendChild(r);
  });
  if (leg.note) { const nt = document.createElement("div"); nt.className = "desc"; nt.textContent = leg.note; li.appendChild(nt); }
  const links = document.createElement("div"); links.className = "desc links";
  links.append("Real prices: ");
  links.appendChild(extLink("Rome2rio", rome2rioUrl(leg.from, leg.to)));
  links.append(" · ");
  links.appendChild(extLink("Google Maps", googleTransitUrl(leg.from, leg.to)));
  li.appendChild(links);
  const fine = document.createElement("div"); fine.className = "fine";
  fine.textContent = "Rough estimate per person, one way, from distance. Real prices can differ a lot.";
  li.appendChild(fine);
  return li;
}
function badge(t) { const b = document.createElement("span"); b.className = "badge"; b.textContent = t; return b; }
function extLink(t, href) { const a = document.createElement("a"); a.textContent = t; a.href = href; a.target = "_blank"; a.rel = "noopener"; return a; }
function btn(txt, label, fn) {
  const b = document.createElement("button"); b.textContent = txt; b.setAttribute("aria-label", label); b.onclick = fn; return b;
}
function move(i, d) {
  const j = i + d; if (j < 0 || j >= list().length) return;
  [list()[i], list()[j]] = [list()[j], list()[i]];
  save(); render();
}

// ---- Descriptions from Wikipedia (free, no key, CORS ok) ----
function shortText(extract, fallback) {
  if (!extract) return fallback || "";
  // First sentence, cut to ~140 chars.
  let s = extract.replace(/\s*\([^)]*\)/g, "").replace(/\s+([,.;])/g, "$1").split(/(?<=[.!?])\s+/)[0] || extract;
  // "Ueno Park is a spacious park…" -> "A spacious park…"
  const m = s.match(/^.{1,70}?\s(?:is|was|are|were)\s(.+)$/);
  if (m) s = m[1].charAt(0).toUpperCase() + m[1].slice(1);
  if (s.length > 140) s = s.slice(0, 137).replace(/\s+\S*$/, "") + "…";
  return s;
}
function norm(s) {
  return s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
}
async function wikiLookup(place, city) {
  const q = city ? `${place} ${city}` : place;
  const sUrl = "https://en.wikipedia.org/w/api.php?action=query&list=search&srlimit=5&format=json&origin=*&srsearch=" + encodeURIComponent(q);
  const sr = await fetch(sUrl).then(r => r.json());
  // Take the first result whose title shares a real word with the place name.
  const words = norm(place).split(" ").filter(w => w.length > 2 && !["the", "and"].includes(w));
  const hits = (sr?.query?.search || []).filter(h => {
    const t = norm(h.title).split(" ");
    return words.some(w => t.includes(w));
  });
  const center = city ? await getCityCenter(city) : null;
  for (const hit of hits) {
    const sum = await fetch("https://en.wikipedia.org/api/rest_v1/page/summary/" + encodeURIComponent(hit.title.replace(/ /g, "_")))
      .then(r => r.ok ? r.json() : null);
    if (!sum) continue;
    const ll = sum.coordinates && typeof sum.coordinates.lat === "number" ? { lat: sum.coordinates.lat, lon: sum.coordinates.lon } : null;
    // Stay in the city: near the city centre, or (no GPS point) the text names the city.
    if (city) {
      if (ll && center) { if (km(ll, center) > MAX_KM) continue; }
      else if (!norm(`${sum.extract || ""} ${sum.description || ""}`).includes(norm(city))) continue;
    }
    const out = { desc: shortText(sum.extract, sum.description), url: sum?.content_urls?.mobile?.page || "" };
    if (ll) Object.assign(out, ll);
    return out;
  }
  return { desc: "", url: "" };
}

const MAX_KM = 50;
function km(a, b) {
  const R = 6371, rad = Math.PI / 180;
  const dLat = (b.lat - a.lat) * rad, dLon = (b.lon - a.lon) * rad;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * rad) * Math.cos(b.lat * rad) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

async function start() {
  if (isTrip()) return startTrip();
  if (!state.places.length) { setStatus("Add places first."); return; }
  $("startBtn").disabled = true;
  // Only look up new places, or all of them if the city changed.
  const todo = state.places.filter(p => p.lookedUpFor !== state.city || p.desc === undefined);
  let done = 0, failed = 0;
  setStatus(`Looking up 0/${todo.length}…`);
  await Promise.all(todo.map(async (p) => {
    delete p.lat; delete p.lon;
    try { Object.assign(p, await wikiLookup(p.name, state.city)); p.lookedUpFor = state.city; }
    catch (e) { failed++; p.desc = ""; p.url = ""; console.warn("lookup failed", p.name, e); }
    done++; setStatus(`Looking up ${done}/${todo.length}…`); render();
  }));
  save(); render();
  setStatus(failed ? `Done. ${failed} lookup(s) failed (check internet).` : "Done.");
  $("startBtn").disabled = false;
}

// ---- Between cities: rough options and prices ----
// Price level per country. Each mode: [base fare, price per km] in USD, per person.
const TIER_OF = {
  JP: "jp", KR: "kr", TW: "kr", CN: "cn",
  FR: "weu", DE: "weu", IT: "weu", ES: "weu", NL: "weu", BE: "weu", AT: "weu", PT: "weu", DK: "weu",
  SE: "weu", FI: "weu", IE: "weu", LU: "weu",
  GB: "hi", CH: "hi", NO: "hi", IS: "hi",
  US: "na", CA: "na", AU: "na", NZ: "na",
  PL: "eeu", CZ: "eeu", HU: "eeu", SK: "eeu", SI: "eeu", HR: "eeu", RO: "eeu", BG: "eeu", GR: "eeu",
  TR: "eeu", RS: "eeu", EE: "eeu", LV: "eeu", LT: "eeu",
  IL: "il", AE: "il",
  TH: "low", VN: "low", IN: "low", ID: "low", MY: "low", PH: "low", KH: "low", LA: "low", NP: "low",
  LK: "low", EG: "low", MA: "low", PE: "low", BO: "low", CO: "low", MX: "low",
};
const PRICES = {
  jp:  { metro: [1, 0.05],   train: [0, 0.11], hsr: [3, 0.20], bus: [5, 0.09] },
  kr:  { metro: [1, 0.05],   train: [2, 0.07], hsr: [3, 0.10], bus: [3, 0.06] },
  cn:  { metro: [0.5, 0.04], train: [1, 0.03], hsr: [1, 0.06], bus: [2, 0.05] },
  weu: { metro: [2, 0.10],   train: [5, 0.13], hsr: [10, 0.15], bus: [5, 0.05] },
  hi:  { metro: [3, 0.15],   train: [6, 0.25], hsr: [10, 0.25], bus: [6, 0.07] },
  na:  { metro: [2.5, 0.10], train: [10, 0.18], hsr: [15, 0.25], bus: [10, 0.08] },
  eeu: { metro: [1, 0.05],   train: [2, 0.05], hsr: [3, 0.08], bus: [2, 0.045] },
  il:  { metro: [1.5, 0.06], train: [2, 0.07], hsr: [3, 0.09], bus: [2, 0.06] },
  low: { metro: [0.5, 0.03], train: [1, 0.02], hsr: [2, 0.05], bus: [1, 0.025] },
  mid: { metro: [1, 0.06],   train: [3, 0.08], hsr: [5, 0.10], bus: [3, 0.05] },
};
const HSR = new Set(["JP", "CN", "KR", "TW", "FR", "ES", "IT", "DE", "BE", "NL", "AT", "TR", "SA", "MA"]);
const CUR_OF = {
  JP: "JPY", KR: "KRW", CN: "CNY", GB: "GBP", CH: "CHF", NO: "NOK", SE: "SEK", DK: "DKK", IS: "ISK",
  US: "USD", CA: "CAD", AU: "AUD", NZ: "NZD", PL: "PLN", CZ: "CZK", HU: "HUF", RO: "RON", BG: "BGN",
  TR: "TRY", IL: "ILS", TH: "THB", IN: "INR", ID: "IDR", MY: "MYR", PH: "PHP", SG: "SGD", ZA: "ZAR",
  MX: "MXN", BR: "BRL", HK: "HKD",
  FR: "EUR", DE: "EUR", IT: "EUR", ES: "EUR", NL: "EUR", BE: "EUR", AT: "EUR", PT: "EUR", FI: "EUR",
  IE: "EUR", LU: "EUR", GR: "EUR", SK: "EUR", SI: "EUR", HR: "EUR", EE: "EUR", LV: "EUR", LT: "EUR",
};
Object.assign(CUR_OF, { TW: "TWD", VN: "VND", KH: "USD", LA: "LAK", NP: "NPR", LK: "LKR", EG: "EGP",
  MA: "MAD", PE: "PEN", BO: "BOB", CO: "COP", AE: "AED", RS: "RSD", AR: "ARS", CL: "CLP" });
let rates = null; // USD -> other currencies, from open.er-api.com (free, no key)
async function loadRates() {
  if (rates) return rates;
  try {
    const r = await fetch("https://open.er-api.com/v6/latest/USD");
    if (r.ok) rates = Object.assign({ USD: 1 }, (await r.json()).rates);
  } catch (e) { console.warn("rates failed", e); }
  return rates;
}

async function cityGeo(name) {
  // Prefer real places (city, town). Fall back to any match.
  for (const extra of ["&osm_tag=place", ""]) {
    try {
      const r = await fetch("https://photon.komoot.io/api/?limit=1&q=" + encodeURIComponent(name) + extra);
      if (!r.ok) continue;
      const f = (await r.json()).features?.[0];
      if (f) return { lat: f.geometry.coordinates[1], lon: f.geometry.coordinates[0], cc: (f.properties.countrycode || "").toUpperCase() };
    } catch (e) { console.warn("cityGeo failed", name, e); }
  }
  return null;
}

function legKey(a, b) { return `${a.name}|${b.name}`; }

function estimateLeg(a, b) {
  const d = km(a, b); // straight line
  const tierA = TIER_OF[a.cc] || "mid", tierB = TIER_OF[b.cc] || "mid";
  const price = (kind, dist) => {
    const pa = PRICES[tierA][kind], pb = PRICES[tierB][kind];
    return ((pa[0] + pb[0]) / 2) + dist * ((pa[1] + pb[1]) / 2);
  };
  const rail = d * 1.2, road = d * 1.25;
  const cur = CUR_OF[a.cc] || "USD";
  if (d > 2000) {
    return { from: a.name, to: b.name, km: d, options: [], cur,
      note: "Too far for metro, train or bus. A flight is the normal option." };
  }
  const opts = [];
  if (d < 40) opts.push({ kind: "metro", label: "Metro / commuter rail", min: 10 + rail / 40 * 60, usd: price("metro", rail) });
  if (d >= 15) {
    const fast = d >= 150 && HSR.has(a.cc) && HSR.has(b.cc);
    if (fast) opts.push({ kind: "hsr", label: "High-speed train", min: 30 + rail / 200 * 60, usd: price("hsr", rail) });
    opts.push({ kind: "train", label: fast ? "Regular train" : "Train", min: 20 + rail / 70 * 60, usd: price("train", rail) });
  }
  opts.push({ kind: "bus", label: "Bus", min: 15 + road / 60 * 60, usd: price("bus", road) });
  opts.sort((x, y) => x.min - y.min);
  let note = "";
  if (d > 800) note = "Long distance: a flight is often faster and can be cheaper.";
  if (a.cc && b.cc && a.cc !== b.cc) note = (note ? note + " " : "") + "Crosses a border: check that a direct route exists.";
  return { from: a.name, to: b.name, km: d, options: opts, note, cur };
}

async function startTrip() {
  const cs = state.cities;
  if (cs.length < 2) { setStatus("Add at least 2 cities."); return; }
  $("startBtn").disabled = true;
  await loadRates();
  let i = 0, missing = [];
  for (const c of cs) {
    setStatus(`Finding cities ${++i}/${cs.length}…`);
    if (typeof c.lat !== "number" || !c.cc) {
      const g = await cityGeo(c.name);
      if (g) Object.assign(c, g); else missing.push(c.name);
    }
  }
  state.legs = {};
  for (let k = 0; k < cs.length - 1; k++) {
    const a = cs[k], b = cs[k + 1];
    state.legs[legKey(a, b)] = (typeof a.lat === "number" && typeof b.lat === "number")
      ? estimateLeg(a, b)
      : { from: a.name, to: b.name, options: [], error: "City not found. Check the spelling." };
  }
  save(); render();
  setStatus(missing.length ? `Done. Not found: ${missing.join(", ")}.` : "Done.");
  $("startBtn").disabled = false;
}

function fmtTime(min) {
  const m = Math.round(min / 5) * 5, h = Math.floor(m / 60), r = m % 60;
  return "≈ " + (h ? `${h} h` : "") + (h && r ? " " : "") + (r || !h ? `${r} min` : "");
}
function round2(x) { // 2 significant digits
  if (x <= 0) return 0;
  const p = Math.pow(10, Math.floor(Math.log10(x)) - 1);
  return Math.round(x / p) * p;
}
function money(x, cur) {
  try { return new Intl.NumberFormat("en", { style: "currency", currency: cur, maximumFractionDigits: 0 }).format(x); }
  catch (e) { return `${Math.round(x)} ${cur}`; }
}
function fmtPrice(usd, cur) {
  const lo = round2(Math.max(usd * 0.8, 1)), hi = round2(Math.max(usd * 1.25, 1));
  const usdTxt = lo === hi ? money(lo, "USD") : `${money(lo, "USD")}–${money(hi, "USD").replace(/^\D+/, "")}`;
  if (!rates || cur === "USD" || !rates[cur]) return usdTxt;
  const f = rates[cur];
  const llo = round2(lo * f), lhi = round2(hi * f);
  return `${money(llo, cur)}–${money(lhi, cur).replace(/^[^\d]+/, "")}\n${usdTxt}`;
}
function rome2rioUrl(a, b) {
  const s = (x) => encodeURIComponent(x.trim().replace(/\s+/g, "-"));
  return `https://www.rome2rio.com/map/${s(a)}/${s(b)}`;
}
function googleTransitUrl(a, b) {
  const u = new URL("https://www.google.com/maps/dir/");
  u.searchParams.set("api", "1"); u.searchParams.set("origin", a); u.searchParams.set("destination", b);
  u.searchParams.set("travelmode", "transit");
  return u.toString();
}

// ---- Map links ----
function stops() {
  if (isTrip()) return routeItems().map(c => c.name);
  return routeItems().map(p => state.city ? `${p.name}, ${state.city}` : p.name);
}
function googleUrl(mode) {
  const s = stops();
  const u = new URL("https://www.google.com/maps/dir/");
  u.searchParams.set("api", "1");
  u.searchParams.set("origin", s[0]);
  u.searchParams.set("destination", s[s.length - 1]);
  u.searchParams.set("travelmode", mode);
  const mid = s.slice(1, -1);
  if (mid.length && mode !== "transit") u.searchParams.set("waypoints", mid.join("|"));
  return u.toString();
}
function appleUrl(mode) {
  // Apple Maps unified URL (iOS 18.4+). Apple drops a waypoint it cannot find by name,
  // so middle stops go as "lat,lon" when we know them.
  const s = stops();
  const u = new URL("https://maps.apple.com/directions");
  u.searchParams.set("source", s[0]);
  u.searchParams.set("destination", s[s.length - 1]);
  if (mode !== "transit") {
    routeItems().slice(1, -1).forEach((p, k) => {
      const hasLL = typeof p.lat === "number" && typeof p.lon === "number";
      u.searchParams.append("waypoint", hasLL ? `${p.lat.toFixed(6)},${p.lon.toFixed(6)}` : s[k + 1]);
    });
  }
  u.searchParams.set("mode", mode);
  return u.toString();
}

// Free geocoding from OpenStreetMap data: Photon first (fuzzy, finds more shops),
// then Nominatim. "bias" = city centre, so results near the city win.
async function photon(q, bias) {
  let url = "https://photon.komoot.io/api/?limit=1&q=" + encodeURIComponent(q);
  if (bias) url += `&lat=${bias.lat}&lon=${bias.lon}`;
  const r = await fetch(url);
  if (!r.ok) return null;
  const f = (await r.json()).features?.[0];
  return f ? { lat: f.geometry.coordinates[1], lon: f.geometry.coordinates[0] } : null;
}
async function nominatim(q) {
  const r = await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&q=" + encodeURIComponent(q));
  if (!r.ok) return null;
  const j = await r.json();
  return j[0] ? { lat: parseFloat(j[0].lat), lon: parseFloat(j[0].lon) } : null;
}
let cityBias = null, cityBiasFor = null;
async function getCityCenter(city) {
  if (cityBiasFor !== city) {
    cityBiasFor = city;
    try { cityBias = await photon(city, null); } catch (e) { cityBias = null; }
    if (!cityBias) cityBiasFor = null; // try again next time
  }
  return cityBias;
}
async function geocode(place, city) {
  const center = city ? await getCityCenter(city) : null;
  const ok = (g) => g && (!center || km(g, center) <= MAX_KM);
  const q = city ? `${place}, ${city}` : place;
  try { const g = await photon(q, center); if (ok(g)) return g; } catch (e) { console.warn("photon failed", q, e); }
  const g = await nominatim(q);
  return ok(g) ? g : null;
}
// Fill missing GPS points for the middle stops (Apple Maps needs them).
async function fillCoords() {
  const need = routeItems().slice(1, -1).filter(p => typeof p.lat !== "number");
  let i = 0, missing = 0;
  for (const p of need) {
    setStatus(`Finding map points ${++i}/${need.length}…`);
    try {
      const g = await geocode(p.name, isTrip() ? "" : state.city);
      if (g) Object.assign(p, g); else missing++;
    } catch (e) { missing++; console.warn("geocode failed", p.name, e); }
    if (i < need.length) await new Promise(r => setTimeout(r, 400));
  }
  save();
  return missing;
}

// ---- Wire up ----
$("city").addEventListener("input", (e) => { state.city = e.target.value.trim(); save(); });
$("addBtn").onclick = () => {
  const lines = $("newPlace").value.split("\n").map(s => s.trim()).filter(Boolean);
  if (!lines.length) return;
  lines.forEach(name => list().push({ name }));
  $("newPlace").value = ""; save(); render(); setStatus("");
};
$("clearBtn").onclick = () => {
  if (list().length && confirm("Remove all?")) { list().length = 0; state.legs = {}; save(); render(); }
};
$("startBtn").onclick = start;
$("mapBtn").onclick = () => {
  if (list().length < 2) { setStatus("Add at least 2 places."); return; }
  if (list().length > 11) setStatus("Note: Google Maps may drop stops after the first 9 waypoints.");
  // Between cities: no walking. Default to transit.
  const walk = $("mode").querySelector('option[value="walking"]');
  walk.hidden = walk.disabled = isTrip();
  if (isTrip() && $("mode").value === "walking") $("mode").value = "transit";
  if (!isTrip() && $("mode").value === "transit") $("mode").value = "walking";
  // 3+ stops: pick one leg (1→2, 2→3, …) or the whole route.
  const items = list(), sel = $("legSel");
  $("legBox").hidden = items.length <= 2;
  if (!$("legBox").hidden) {
    sel.innerHTML = "";
    sel.add(new Option(`Whole route: ${items.map(c => c.name).join(" → ")}`, "all"));
    for (let k = 0; k < items.length - 1; k++) sel.add(new Option(`${k + 1}→${k + 2}: ${items[k].name} → ${items[k + 1].name}`, String(k)));
    // After a one-leg map, offer the next leg.
    const next = state.lastLeg && state.lastLeg.mode === state.mode ? state.lastLeg.k + 1 : -1;
    sel.value = next >= 0 && next < items.length - 1 ? String(next) : "all";
  }
  syncLeg();
  $("mapDlg").showModal();
};
// Middle stops work only for: Google walking/driving, Apple driving.
// Transit (both) and Apple walking go one leg at a time.
function syncLeg() {
  const aBtn = $("aBtn");
  aBtn.disabled = false; aBtn.textContent = "Apple Maps";
  if ($("legBox").hidden) { $("legHint").textContent = ""; return; }
  const mode = $("mode").value, sel = $("legSel");
  const all = sel.options[0];
  all.disabled = mode === "transit";
  if (all.disabled && sel.value === "all") sel.value = "0";
  let hint = "";
  if (mode === "transit") hint = "Transit opens one leg at a time. Come back for the next leg.";
  else if (mode === "walking" && sel.value === "all") {
    hint = "Apple Maps walking can't stop in the middle. Pick one leg, or use Google Maps.";
    aBtn.disabled = true; aBtn.textContent = "Apple Maps (pick one leg)";
  } else if (mode === "walking") hint = "Apple Maps: one leg at a time. Come back for the next leg.";
  $("legHint").textContent = hint;
}
$("mode").addEventListener("change", syncLeg);
$("legSel").addEventListener("change", syncLeg);
// The stops to send to the map: the whole list, or one leg.
function routeItems() {
  if (!$("legBox").hidden && $("legSel").value !== "all") {
    const k = +$("legSel").value;
    return list().slice(k, k + 2);
  }
  return list();
}
function rememberLeg() {
  const v = $("legBox").hidden ? "all" : $("legSel").value;
  state.lastLeg = v === "all" ? null : { mode: state.mode, k: +v };
  save();
}
$("gBtn").onclick = () => { rememberLeg(); location.href = googleUrl($("mode").value); $("mapDlg").close(); };
$("aBtn").onclick = async () => {
  const mode = $("mode").value;
  rememberLeg();
  $("mapDlg").close();
  const missing = mode === "transit" ? 0 : await fillCoords();
  setStatus(missing ? `${missing} stop(s) not found on the map. Apple Maps may skip them.` : "");
  location.href = appleUrl(mode);
};
$("cancelBtn").onclick = () => $("mapDlg").close();

$("segCity").onclick = () => { state.mode = "city"; save(); applyMode(); };
$("segTrip").onclick = () => { state.mode = "trip"; save(); applyMode(); };

load();
$("city").value = state.city || "";
applyMode();
$("ver").textContent = "v" + APP_VERSION;
console.log("Travel Plan", APP_VERSION);
</script>
