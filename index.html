<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Travel Plan">
<title>Travel Plan</title>
<style>
  :root {
    --bg: #f4f2ee; --card: #ffffff; --ink: #1d1d1f; --muted: #6e6e73;
    --line: #e2dfd8; --accent: #0a7c6e; --accent-ink: #ffffff; --danger: #c0392b;
    --tag-m: #e8a33d; --tag-a: #2f80c4; --tag-e: #7b4fb5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111214; --card: #1c1d20; --ink: #f2f2f4; --muted: #9a9aa1;
      --line: #2c2d31; --accent: #2bb3a0; --accent-ink: #06201c; --danger: #ff6b5b;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
  }
  main { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 28px; margin: 8px 0 16px; letter-spacing: -0.02em; }
  label.small { display: block; font-size: 13px; color: var(--muted); margin: 0 0 6px 2px; text-transform: uppercase; letter-spacing: .05em; }
  input, textarea, select {
    width: 100%; font: inherit; font-size: 17px; color: var(--ink);
    background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px;
  }
  textarea { resize: vertical; min-height: 48px; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  .section { margin-bottom: 18px; }
  button {
    font: inherit; font-size: 16px; font-weight: 600; border: 0; border-radius: 12px;
    padding: 12px 14px; cursor: pointer; background: var(--line); color: var(--ink);
  }
  button.primary { background: var(--accent); color: var(--accent-ink); }
  button:disabled { opacity: .5; }
  ol#list { list-style: none; padding: 0; margin: 0; }
  li.place {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 12px; margin-bottom: 10px; display: flex; gap: 10px; align-items: flex-start;
  }
  .num {
    flex: 0 0 28px; height: 28px; border-radius: 50%; background: var(--accent); color: var(--accent-ink);
    display: grid; place-items: center; font-weight: 700; font-size: 14px; margin-top: 2px;
  }
  .body { flex: 1; min-width: 0; }
  .name { font-weight: 600; font-size: 17px; word-wrap: break-word; }
  .tag { font-size: 12px; font-weight: 700; letter-spacing: .08em; margin-top: 2px; }
  .tag.MORNING { color: var(--tag-m); } .tag.AFTERNOON { color: var(--tag-a); } .tag.EVENING { color: var(--tag-e); }
  .desc { color: var(--muted); font-size: 15px; margin-top: 2px; }
  .desc a { color: var(--accent); text-decoration: none; }
  .ctrls { display: flex; flex-direction: column; gap: 4px; }
  .ctrls button { padding: 6px 10px; font-size: 15px; min-width: 40px; }
  .ctrls button.del { color: var(--danger); }
  .empty { color: var(--muted); text-align: center; padding: 20px 0; }
  .actions { position: sticky; bottom: 0; padding-top: 10px; background: linear-gradient(transparent, var(--bg) 30%); }
  .status { font-size: 14px; color: var(--muted); min-height: 20px; margin: 6px 2px; }
  dialog { border: 0; border-radius: 16px; background: var(--card); color: var(--ink); padding: 20px; width: min(92vw, 380px); }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  dialog h2 { margin: 0 0 12px; font-size: 20px; }
  dialog .stack { display: flex; flex-direction: column; gap: 10px; }
</style>
</head>
<body>
<main>
  <h1>Travel Plan</h1>

  <div class="section">
    <label class="small" for="city">City</label>
    <input id="city" placeholder="e.g. Tokyo" autocomplete="off">
  </div>

  <div class="section">
    <label class="small" for="newPlace">Add places (one per line)</label>
    <textarea id="newPlace" rows="2" placeholder="Ueno Park&#10;Senso-ji"></textarea>
    <div class="row" style="margin-top:8px">
      <button id="addBtn">Add</button>
      <button id="clearBtn">Clear list</button>
    </div>
  </div>

  <ol id="list"></ol>

  <div class="actions">
    <div class="status" id="status"></div>
    <div class="row">
      <button class="primary" id="startBtn">Start</button>
      <button class="primary" id="mapBtn">To map</button>
    </div>
  </div>
</main>

<dialog id="mapDlg">
  <h2>Open route in…</h2>
  <div class="stack">
    <label class="small" for="mode">Travel mode</label>
    <select id="mode">
      <option value="walking">Walking</option>
      <option value="driving">Driving</option>
      <option value="transit">Transit (start + end only)</option>
    </select>
    <button class="primary" id="gBtn">Google Maps</button>
    <button class="primary" id="aBtn">Apple Maps</button>
    <button id="cancelBtn">Cancel</button>
  </div>
</dialog>

<script>
const APP_VERSION = "1.0.0";
const KEY = "travelplan.v1";
const $ = (id) => document.getElementById(id);

let state = { city: "", places: [] }; // place: { name, desc, url }

function load() {
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && Array.isArray(s.places)) state = s; } catch (e) {}
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
}
function setStatus(t) { $("status").textContent = t; }

// MORNING / AFTERNOON / EVENING by position in the list (split in thirds).
function timeTag(i, n) {
  if (n <= 1) return "MORNING";
  const f = i / n;
  return f < 1/3 ? "MORNING" : f < 2/3 ? "AFTERNOON" : "EVENING";
}

function render() {
  const ol = $("list");
  ol.innerHTML = "";
  const n = state.places.length;
  if (!n) { ol.innerHTML = '<li class="empty">No places yet.</li>'; return; }
  state.places.forEach((p, i) => {
    const li = document.createElement("li");
    li.className = "place";
    const num = document.createElement("div"); num.className = "num"; num.textContent = i + 1;
    const body = document.createElement("div"); body.className = "body";
    const name = document.createElement("div"); name.className = "name"; name.textContent = p.name;
    body.appendChild(name);
    if (p.desc !== undefined) {
      const tag = timeTag(i, n);
      const t = document.createElement("div"); t.className = "tag " + tag; t.textContent = tag;
      const d = document.createElement("div"); d.className = "desc"; d.textContent = p.desc || "No description found.";
      if (p.url) {
        const a = document.createElement("a"); a.href = p.url; a.target = "_blank"; a.rel = "noopener"; a.textContent = " More";
        d.appendChild(a);
      }
      body.append(t, d);
    }
    const c = document.createElement("div"); c.className = "ctrls";
    const up = btn("▲", "Move up", () => move(i, -1)); up.disabled = i === 0;
    const dn = btn("▼", "Move down", () => move(i, 1)); dn.disabled = i === n - 1;
    const del = btn("✕", "Remove", () => { state.places.splice(i, 1); save(); render(); }); del.className = "del";
    c.append(up, dn, del);
    li.append(num, body, c);
    ol.appendChild(li);
  });
}
function btn(txt, label, fn) {
  const b = document.createElement("button"); b.textContent = txt; b.setAttribute("aria-label", label); b.onclick = fn; return b;
}
function move(i, d) {
  const j = i + d; if (j < 0 || j >= state.places.length) return;
  [state.places[i], state.places[j]] = [state.places[j], state.places[i]];
  save(); render();
}

// ---- Descriptions from Wikipedia (free, no key, CORS ok) ----
function shortText(extract, fallback) {
  if (!extract) return fallback || "";
  // First sentence, cut to ~140 chars.
  let s = extract.replace(/\s*\([^)]*\)/g, "").replace(/\s+([,.;])/g, "$1").split(/(?<=[.!?])\s+/)[0] || extract;
  // "Ueno Park is a spacious park…" -> "A spacious park…"
  const m = s.match(/^.{1,70}?\s(?:is|was|are|were)\s(.+)$/);
  if (m) s = m[1].charAt(0).toUpperCase() + m[1].slice(1);
  if (s.length > 140) s = s.slice(0, 137).replace(/\s+\S*$/, "") + "…";
  return s;
}
function norm(s) {
  return s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
}
async function wikiLookup(place, city) {
  const q = city ? `${place} ${city}` : place;
  const sUrl = "https://en.wikipedia.org/w/api.php?action=query&list=search&srlimit=5&format=json&origin=*&srsearch=" + encodeURIComponent(q);
  const sr = await fetch(sUrl).then(r => r.json());
  // Take the first result whose title shares a real word with the place name.
  const words = norm(place).split(" ").filter(w => w.length > 2 && !["the", "and"].includes(w));
  const hit = (sr?.query?.search || []).find(h => {
    const t = norm(h.title).split(" ");
    return words.some(w => t.includes(w));
  });
  if (!hit) return { desc: "", url: "" };
  const sum = await fetch("https://en.wikipedia.org/api/rest_v1/page/summary/" + encodeURIComponent(hit.title.replace(/ /g, "_")))
    .then(r => r.ok ? r.json() : null);
  if (!sum) return { desc: "", url: "" };
  return { desc: shortText(sum.extract, sum.description), url: sum?.content_urls?.mobile?.page || "" };
}

async function start() {
  if (!state.places.length) { setStatus("Add places first."); return; }
  $("startBtn").disabled = true;
  let done = 0, failed = 0;
  setStatus(`Looking up 0/${state.places.length}…`);
  await Promise.all(state.places.map(async (p) => {
    try { Object.assign(p, await wikiLookup(p.name, state.city)); }
    catch (e) { failed++; p.desc = ""; p.url = ""; console.warn("lookup failed", p.name, e); }
    done++; setStatus(`Looking up ${done}/${state.places.length}…`); render();
  }));
  save(); render();
  setStatus(failed ? `Done. ${failed} lookup(s) failed (check internet).` : "Done.");
  $("startBtn").disabled = false;
}

// ---- Map links ----
function stops() {
  return state.places.map(p => state.city ? `${p.name}, ${state.city}` : p.name);
}
function googleUrl(mode) {
  const s = stops();
  const u = new URL("https://www.google.com/maps/dir/");
  u.searchParams.set("api", "1");
  u.searchParams.set("origin", s[0]);
  u.searchParams.set("destination", s[s.length - 1]);
  u.searchParams.set("travelmode", mode);
  const mid = s.slice(1, -1);
  if (mid.length && mode !== "transit") u.searchParams.set("waypoints", mid.join("|"));
  return u.toString();
}
function appleUrl(mode) {
  // Apple Maps unified URL (iOS 18.4+): supports several waypoints.
  const s = stops();
  const u = new URL("https://maps.apple.com/directions");
  u.searchParams.set("source", s[0]);
  u.searchParams.set("destination", s[s.length - 1]);
  if (mode !== "transit") s.slice(1, -1).forEach(w => u.searchParams.append("waypoint", w));
  u.searchParams.set("mode", mode);
  return u.toString();
}

// ---- Wire up ----
$("city").addEventListener("input", (e) => { state.city = e.target.value.trim(); save(); });
$("addBtn").onclick = () => {
  const lines = $("newPlace").value.split("\n").map(s => s.trim()).filter(Boolean);
  if (!lines.length) return;
  lines.forEach(name => state.places.push({ name }));
  $("newPlace").value = ""; save(); render(); setStatus("");
};
$("clearBtn").onclick = () => {
  if (state.places.length && confirm("Remove all places?")) { state.places = []; save(); render(); }
};
$("startBtn").onclick = start;
$("mapBtn").onclick = () => {
  if (state.places.length < 2) { setStatus("Add at least 2 places."); return; }
  if (state.places.length > 11) setStatus("Note: Google Maps may drop stops after the first 9 waypoints.");
  $("mapDlg").showModal();
};
$("gBtn").onclick = () => { location.href = googleUrl($("mode").value); $("mapDlg").close(); };
$("aBtn").onclick = () => { location.href = appleUrl($("mode").value); $("mapDlg").close(); };
$("cancelBtn").onclick = () => $("mapDlg").close();

load();
$("city").value = state.city || "";
render();
console.log("Travel Plan", APP_VERSION);
</script>
</body>
</html>
