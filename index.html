<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Travel Plan">
<title>Travel Plan</title>
<style>
  :root {
    --bg: #f4f2ee; --card: #ffffff; --ink: #1d1d1f; --muted: #6e6e73;
    --line: #e2dfd8; --accent: #0a7c6e; --accent-ink: #ffffff; --danger: #c0392b;
    --tag-m: #e8a33d; --tag-a: #2f80c4; --tag-e: #7b4fb5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111214; --card: #1c1d20; --ink: #f2f2f4; --muted: #9a9aa1;
      --line: #2c2d31; --accent: #2bb3a0; --accent-ink: #06201c; --danger: #ff6b5b;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
  }
  main { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 28px; margin: 8px 0 16px; letter-spacing: -0.02em; }
  label.small { display: block; font-size: 13px; color: var(--muted); margin: 0 0 6px 2px; text-transform: uppercase; letter-spacing: .05em; }
  input, textarea, select {
    width: 100%; font: inherit; font-size: 17px; color: var(--ink);
    background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px;
  }
  textarea { resize: vertical; min-height: 48px; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  .section { margin-bottom: 18px; }
  button {
    font: inherit; font-size: 16px; font-weight: 600; border: 0; border-radius: 12px;
    padding: 12px 14px; cursor: pointer; background: var(--line); color: var(--ink);
  }
  button.primary { background: var(--accent); color: var(--accent-ink); }
  button:disabled { opacity: .5; }
  ol#list { list-style: none; padding: 0; margin: 0; }
  li.place {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 12px; margin-bottom: 10px; display: flex; gap: 10px; align-items: flex-start;
  }
  .num {
    flex: 0 0 28px; height: 28px; border-radius: 50%; background: var(--accent); color: var(--accent-ink);
    display: grid; place-items: center; font-weight: 700; font-size: 14px; margin-top: 2px;
  }
  .body { flex: 1; min-width: 0; }
  .name { display: block; font-weight: 600; font-size: 17px; word-wrap: break-word; color: var(--ink); text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
  .tag { font-size: 12px; font-weight: 700; letter-spacing: .08em; margin-top: 2px; }
  .tag.MORNING { color: var(--tag-m); } .tag.AFTERNOON { color: var(--tag-a); } .tag.EVENING { color: var(--tag-e); }
  .desc { color: var(--muted); font-size: 15px; margin-top: 2px; }
  .desc a { color: var(--accent); text-decoration: none; }
  .ctrls { display: flex; flex-direction: column; gap: 4px; }
  .ctrls button { padding: 6px 10px; font-size: 15px; min-width: 40px; }
  .ctrls button.del { color: var(--danger); }
  .empty { color: var(--muted); text-align: center; padding: 20px 0; }
  .actions { position: sticky; bottom: 0; padding-top: 10px; background: linear-gradient(transparent, var(--bg) 30%); }
  .status { font-size: 14px; color: var(--muted); min-height: 20px; margin: 6px 2px; }
  .seg { display: flex; background: var(--line); border-radius: 12px; padding: 3px; gap: 3px; }
  .seg button { flex: 1; background: transparent; padding: 9px 8px; font-size: 15px; }
  .seg button.on { background: var(--card); box-shadow: 0 1px 3px rgba(0,0,0,.15); }
  li.leg { margin: -4px 0 10px 24px; padding: 10px 12px; border-left: 3px solid var(--accent); background: var(--card); border-radius: 0 12px 12px 0; }
  .leghead { font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 4px; }
  .opt { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 0; border-top: 1px solid var(--line); }
  .opt:first-of-type { border-top: 0; }
  .optname { font-weight: 600; }
  .price { font-weight: 600; text-align: right; font-size: 15px; white-space: pre; }
  li.place.compact { align-items: center; }
  li.place.compact .ctrls { flex-direction: row; }
  .badge { font-size: 11px; font-weight: 700; margin-left: 6px; padding: 2px 6px; border-radius: 6px; background: var(--accent); color: var(--accent-ink); vertical-align: 2px; }
  .links { margin-top: 6px; }
  .links a { color: var(--accent); text-decoration: none; font-weight: 600; }
  .fine { font-size: 12px; color: var(--muted); margin-top: 4px; }
  [hidden] { display: none !important; }
  dialog { border: 0; border-radius: 16px; background: var(--card); color: var(--ink); padding: 20px; width: min(92vw, 380px); }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  dialog h2 { margin: 0 0 12px; font-size: 20px; }
  dialog .stack { display: flex; flex-direction: column; gap: 10px; }
  .ctrls button.fav.on { color: #e0a400; }
  /* Home: one square per city */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
  .tile { aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 10px; text-align: center; }
  .tile .flag { font-size: 40px; line-height: 1; }
  .tile .tname { font-size: 17px; font-weight: 700; word-break: break-word; }
  .tile .tcount { font-size: 13px; color: var(--muted); font-weight: 500; }
  .tile.add { border-style: dashed; background: transparent; color: var(--muted); }
  /* City page */
  .topbar { display: flex; justify-content: space-between; align-items: center; }
  button.back { background: transparent; color: var(--accent); padding: 8px 0; }
  button.small { padding: 8px 10px; font-size: 14px; background: transparent; }
  button.del { color: var(--danger); }
  .sug { list-style: none; margin: 4px 0 0; padding: 0; background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .sug button { width: 100%; text-align: left; background: transparent; border-radius: 0; padding: 10px 14px; border-top: 1px solid var(--line); }
  .sug li:first-child button { border-top: 0; }
  .sug .ssub { display: block; font-size: 13px; color: var(--muted); font-weight: 400; }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 6px; scrollbar-width: none; }
  .chip { flex: 0 0 auto; padding: 7px 12px; font-size: 14px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); }
  .chip.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .pickbar { display: flex; gap: 14px; align-items: center; font-size: 14px; color: var(--muted); margin: 2px 2px 8px; }
  button.link { background: transparent; padding: 4px 0; color: var(--accent); font-size: 14px; }
  #favPlaces { list-style: none; padding: 0; margin: 0; }
  li.fplace { display: flex; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; margin-bottom: 8px; }
  li.fplace input[type=checkbox] { width: 22px; height: 22px; flex: 0 0 22px; accent-color: var(--accent); }
  .catsel { width: auto; font-size: 13px; padding: 4px 8px; margin-top: 6px; border-radius: 8px; }
  li.fplace button.del { padding: 6px 10px; background: transparent; }
</style>
</head>
<body>
<main>
<section id="homeView">
  <h1>Travel Plan <span id="ver" style="font-size:13px;font-weight:500;color:var(--muted);letter-spacing:0"></span></h1>
  <div class="grid" id="cityGrid"></div>
  <div class="section" style="margin-top:16px">
    <button id="tripBtn" style="width:100%">🚆 Plan a trip between cities</button>
  </div>
</section>

<section id="cityView" hidden>
  <div class="topbar">
    <button id="cityBack" class="back">‹ Cities</button>
    <button id="cityDel" class="small del">Remove city</button>
  </div>
  <h1 id="cityTitle"></h1>
  <div class="section">
    <label class="small" for="newFav">Add a favorite place</label>
    <input id="newFav" placeholder="Type a place name" autocomplete="off">
    <ul id="sug" class="sug" hidden></ul>
    <div class="row" style="margin-top:8px">
      <select id="newCat" aria-label="Category"></select>
      <button id="newFavBtn" class="primary">Save</button>
    </div>
  </div>
  <div class="chips" id="catChips" role="group" aria-label="Filter by category"></div>
  <div class="pickbar">
    <span id="pickCount"></span>
    <button id="pickAll" class="link">Choose all shown</button>
    <button id="pickNone" class="link">Clear</button>
  </div>
  <ul id="favPlaces"></ul>
  <div class="actions">
    <div class="status" id="cityStatus"></div>
    <div class="row">
      <button class="primary" id="gmapBtn">Show on Google Maps</button>
      <button class="primary" id="routeBtn">Plan route</button>
    </div>
  </div>
</section>

<section id="planView" hidden>
  <div class="topbar"><button id="planBack" class="back">‹ Back</button></div>
  <h1 id="planTitle">Route</h1>

  <div class="section">
    <label class="small" for="newPlace" id="addLbl">Add places (one per line)</label>
    <textarea id="newPlace" rows="2" placeholder="Ueno Park&#10;Senso-ji"></textarea>
    <div class="row" style="margin-top:8px">
      <button id="addBtn">Add</button>
      <button id="clearBtn">Clear list</button>
    </div>
  </div>

  <ol id="list"></ol>

  <div class="actions">
    <div class="status" id="status"></div>
    <div class="row">
      <button class="primary" id="startBtn">Start</button>
      <button class="primary" id="mapBtn">To map</button>
    </div>
  </div>
</section>
</main>

<dialog id="mapDlg">
  <h2>Open in Google Maps</h2>
  <div class="stack">
    <label class="small" for="mode">Travel mode</label>
    <select id="mode">
      <option value="walking">Walking</option>
      <option value="driving">Driving</option>
      <option value="transit">Transit (start + end only)</option>
    </select>
    <div id="legBox" class="stack" hidden>
      <label class="small" for="legSel">Route</label>
      <select id="legSel"></select>
      <div class="fine" id="legHint"></div>
    </div>
    <button class="primary" id="gBtn">Open Google Maps</button>
    <button id="cancelBtn">Cancel</button>
  </div>
</dialog>

<script>
const APP_VERSION = "2.0.0";
const KEY = "travelplan.v1";
const FAV_KEY = "travelplan.favs.v1"; // own key, so "Clear list" never touches favorites
const $ = (id) => document.getElementById(id);

// mode "city": places inside one city. mode "trip": travel between cities.
let state = { mode: "city", city: "", places: [], cities: [], legs: {} };
const isTrip = () => state.mode === "trip";
const list = () => (isTrip() ? state.cities : state.places);

function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && Array.isArray(s.places)) state = Object.assign(state, s);
  } catch (e) {}
  if (!Array.isArray(state.cities)) state.cities = [];
  if (!state.legs) state.legs = {};
}
function applyMode() {
  $("planTitle").textContent = isTrip() ? "Between cities" : `${flag(cityCC(state.city))} ${state.city || "Route"}`;
  $("planBack").textContent = isTrip() || !state.city ? "‹ Cities" : `‹ ${state.city}`;
  $("addLbl").textContent = isTrip() ? "Add cities (one per line)" : "Add places (one per line)";
  $("newPlace").placeholder = isTrip() ? "Tokyo\nKyoto\nOsaka" : "Ueno Park\nSenso-ji";
  setStatus("");
  render();
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
}
function setStatus(t) { $("status").textContent = t; }

// ---- Favorites: places keep their city; cities stand alone ----
let favs = { places: [], cities: [] };
function loadFavs() {
  try {
    const f = JSON.parse(localStorage.getItem(FAV_KEY));
    if (f) favs = { places: Array.isArray(f.places) ? f.places : [], cities: Array.isArray(f.cities) ? f.cities : [] };
  } catch (e) {}
}
function saveFavs() {
  try { localStorage.setItem(FAV_KEY, JSON.stringify(favs)); } catch (e) {}
}
const favList = () => (isTrip() ? favs.cities : favs.places);
const same = (a, b) => (a || "").trim().toLowerCase() === (b || "").trim().toLowerCase();
function favIndex(p) {
  return favList().findIndex(f => same(f.name, p.name) && (isTrip() || same(f.city, state.city)));
}
function toggleFav(p) {
  const i = favIndex(p);
  if (i >= 0) { favList().splice(i, 1); setStatus(`Removed "${p.name}" from favorites.`); }
  else {
    if (isTrip()) cityRec(p.name);
    else { favs.places.push({ name: p.name, city: state.city, cat: "Other" }); cityRec(state.city); }
    setStatus(`Saved "${p.name}" to favorites.`);
  }
  saveFavs(); render();
}

// ---- Home page: one square per favorite city ----
const CATS = ["Restaurant", "Café", "Bar", "Park", "Museum", "Sight", "Shop", "Hotel", "Other"];
const CAT_ICON = { Restaurant: "🍽️", "Café": "☕", Bar: "🍸", Park: "🌳", Museum: "🏛️", Sight: "📸", Shop: "🛍️", Hotel: "🛏️", Other: "📍" };
const catOf = (p) => (CATS.includes(p.cat) ? p.cat : "Other");
// Country code "JP" -> 🇯🇵 (two regional-indicator letters).
function flag(cc) {
  return /^[A-Z]{2}$/.test(cc || "") ? String.fromCodePoint(...[...cc].map(c => 0x1F1E6 + c.charCodeAt(0) - 65)) : "🏙️";
}
const cityCC = (name) => (favs.cities.find(c => same(c.name, name)) || {}).cc;
function cityRec(name) {
  let c = favs.cities.find(c => same(c.name, name));
  if (!c) { c = { name }; favs.cities.push(c); }
  return c;
}
// Every saved city, plus any city that has saved places.
function favCities() {
  favs.places.forEach(p => { if (p.city) cityRec(p.city); });
  return favs.cities.slice().sort((a, b) => a.name.localeCompare(b.name));
}
const flagTried = new Set(); // this session only, so an offline start tries again next time
async function fillFlags() {
  const miss = favCities().filter(c => !c.cc && !flagTried.has(c.name));
  if (!miss.length) return;
  console.log("fillFlags: looking up", miss.map(c => c.name));
  for (const c of miss) {
    flagTried.add(c.name);
    const g = await cityGeo(c.name);
    if (g && g.cc) Object.assign(c, { cc: g.cc });
    else console.warn("fillFlags: no country found for", c.name);
  }
  saveFavs();
  if (view() === "home") renderHome();
}
function renderHome() {
  const g = $("cityGrid"); g.innerHTML = "";
  favCities().forEach(c => {
    const n = favs.places.filter(p => same(p.city, c.name)).length;
    const b = document.createElement("button"); b.className = "tile";
    for (const [cls, txt] of [["flag", flag(c.cc)], ["tname", c.name], ["tcount", n === 1 ? "1 place" : `${n} places`]]) {
      const s = document.createElement("span"); s.className = cls; s.textContent = txt; b.appendChild(s);
    }
    b.onclick = () => go("city", c.name);
    g.appendChild(b);
  });
  const add = document.createElement("button"); add.className = "tile add";
  add.innerHTML = `<span class="flag">＋</span><span class="tname">Add city</span>`;
  add.onclick = () => {
    const name = (prompt("City name, e.g. Tokyo") || "").trim();
    if (!name) return;
    cityRec(name); saveFavs(); go("city", name);
  };
  g.appendChild(add);
  fillFlags();
}

// ---- City page: favorite places with a category ----
let curCity = "", catFilter = "All", picked = new Set(), sugPick = null;
const pkey = (p) => p.name.trim().toLowerCase();
const cityPlaces = () => favs.places.filter(p => same(p.city, curCity));
const chosen = () => cityPlaces().filter(p => picked.has(pkey(p)));
const shownPlaces = () => cityPlaces().filter(p => catFilter === "All" || catOf(p) === catFilter);
function cityStatus(t) { $("cityStatus").textContent = t; }
function renderCity() {
  $("cityTitle").textContent = `${flag(cityCC(curCity))} ${curCity}`;
  const ps = cityPlaces();
  const present = CATS.filter(k => ps.some(p => catOf(p) === k));
  if (catFilter !== "All" && !present.includes(catFilter)) catFilter = "All";
  const chips = $("catChips"); chips.innerHTML = "";
  ["All", ...present].forEach(k => {
    const n = k === "All" ? ps.length : ps.filter(p => catOf(p) === k).length;
    const b = btn(`${k === "All" ? "" : CAT_ICON[k] + " "}${k} · ${n}`, `Show ${k}`, () => { catFilter = k; renderCity(); });
    b.className = "chip" + (k === catFilter ? " on" : "");
    chips.appendChild(b);
  });
  chips.hidden = !ps.length;
  const ul = $("favPlaces"); ul.innerHTML = "";
  if (!ps.length) ul.innerHTML = `<li class="empty">No places yet. Add one above.</li>`;
  shownPlaces().forEach(p => {
    const li = document.createElement("li"); li.className = "fplace";
    const cb = document.createElement("input"); cb.type = "checkbox"; cb.checked = picked.has(pkey(p));
    cb.setAttribute("aria-label", "Choose " + p.name);
    cb.onchange = () => { cb.checked ? picked.add(pkey(p)) : picked.delete(pkey(p)); syncPick(); };
    const body = document.createElement("div"); body.className = "body";
    body.appendChild(extLink(p.name, gSearch(placeQ(p, curCity)))).className = "name";
    if (p.addr) { const a = document.createElement("div"); a.className = "fine"; a.textContent = p.addr; body.appendChild(a); }
    const sel = document.createElement("select"); sel.className = "catsel"; sel.setAttribute("aria-label", "Category of " + p.name);
    CATS.forEach(k => sel.add(new Option(`${CAT_ICON[k]} ${k}`, k)));
    sel.value = catOf(p);
    sel.onchange = () => { p.cat = sel.value; saveFavs(); renderCity(); };
    body.appendChild(sel);
    const del = btn("✕", "Remove from favorites", () => {
      if (!confirm(`Remove "${p.name}" from favorites?`)) return;
      favs.places.splice(favs.places.indexOf(p), 1); picked.delete(pkey(p)); saveFavs(); renderCity();
    });
    del.className = "del";
    li.append(cb, body, del);
    ul.appendChild(li);
  });
  syncPick();
}
function syncPick() {
  const n = chosen().length;
  $("pickCount").textContent = n ? `${n} chosen` : "Tick places to choose them.";
  $("pickNone").hidden = !n;
  $("gmapBtn").disabled = !n;
  $("routeBtn").disabled = n < 2;
}
// Search text for a place: name + saved address (a picked branch), else name + city.
function placeQ(p, city) { return p.addr ? `${p.name}, ${p.addr}` : city ? `${p.name}, ${city}` : p.name; }
function gSearch(q) { return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(q); }
// One place: a search pin. More: walking directions through all of them.
function gChosenUrl(ps) {
  const s = ps.map(p => placeQ(p, curCity));
  if (s.length === 1) return gSearch(s[0]);
  const u = new URL("https://www.google.com/maps/dir/");
  u.searchParams.set("api", "1"); u.searchParams.set("origin", s[0]); u.searchParams.set("destination", s[s.length - 1]);
  u.searchParams.set("travelmode", "walking");
  if (s.length > 2) u.searchParams.set("waypoints", s.slice(1, -1).join("|"));
  return u.toString();
}

// Suggestions while typing: OpenStreetMap places near the city centre (Photon, free, no key).
function osmCat(k, v) {
  if (k === "amenity") return { restaurant: "Restaurant", fast_food: "Restaurant", food_court: "Restaurant", cafe: "Café",
    ice_cream: "Café", bar: "Bar", pub: "Bar", biergarten: "Bar", nightclub: "Bar", place_of_worship: "Sight", theatre: "Sight" }[v] || "Other";
  if (k === "leisure") return ["park", "garden", "nature_reserve"].includes(v) ? "Park" : "Other";
  if (k === "shop") return "Shop";
  if (k === "tourism") return { museum: "Museum", gallery: "Museum", hotel: "Hotel", hostel: "Hotel", guest_house: "Hotel",
    apartment: "Hotel", zoo: "Park", information: "Other" }[v] || "Sight";
  if (k === "historic" || k === "man_made") return "Sight";
  if (k === "boundary" && v === "national_park") return "Park";
  return "Other";
}
let sugSeq = 0;
async function suggest(q) {
  const seq = ++sugSeq;
  const center = await getCityCenter(curCity);
  let url = "https://photon.komoot.io/api/?limit=10&lang=en&q=" + encodeURIComponent(q);
  if (center) url += `&lat=${center.lat}&lon=${center.lon}`;
  let fs = [];
  try { const r = await fetch(url); if (r.ok) fs = (await r.json()).features || []; }
  catch (e) { console.warn("suggest failed", q, e); }
  if (seq !== sugSeq) return; // a newer search is running
  const seen = new Set(), out = [];
  for (const f of fs) {
    const pr = f.properties, ll = { lat: f.geometry.coordinates[1], lon: f.geometry.coordinates[0] };
    if (!pr.name || ["city", "country", "state", "county"].includes(pr.type)) continue;
    if (center && km(ll, center) > MAX_KM) continue; // stay in this city
    // Chains have many branches: keep each branch, but not exact repeats.
    const sub = [...new Set([pr.street, pr.district || pr.locality, pr.city].filter(Boolean))].join(", ")
      || (pr.osm_value || "").replace(/_/g, " ");
    const k = (pr.name + "|" + sub).toLowerCase(); if (seen.has(k)) continue; seen.add(k);
    out.push({ name: pr.name, cat: osmCat(pr.osm_key, pr.osm_value), sub, ...ll });
    if (out.length === 5) break;
  }
  showSug(out);
}
function showSug(list) {
  const ul = $("sug"); ul.innerHTML = "";
  ul.hidden = !list.length;
  list.forEach(s => {
    const li = document.createElement("li");
    const b = document.createElement("button");

// ---- Descriptions from Wikipedia (free, no key, CORS ok) ----
function shortText(extract, fallback) {
  if (!extract) return fallback || "";
  // First sentence, cut to ~140 chars.
  let s = extract.replace(/\s*\([^)]*\)/g, "").replace(/\s+([,.;])/g, "$1").split(/(?<=[.!?])\s+/)[0] || extract;
  // "Ueno Park is a spacious park…" -> "A spacious park…"
  const m = s.match(/^.{1,70}?\s(?:is|was|are|were)\s(.+)$/);
  if (m) s = m[1].charAt(0).toUpperCase() + m[1].slice(1);
  if (s.length > 140) s = s.slice(0, 137).replace(/\s+\S*$/, "") + "…";
  return s;
}
function norm(s) {

async function wikiLookup(place, city) {
  const q = city ? `${place} ${city}` : place;
  const sUrl = "https://en.wikipedia.org/w/api.php?action=query&list=search&srlimit=5&format=json&origin=*&srsearch=" + encodeURIComponent(q);
  const sr = await fetch(sUrl).then(r => r.json());
  // Take the first result whose title shares a real word with the place name.
  const words = norm(place).split(" ").filter(w => w.length > 2 && !["the", "and"].includes(w));
  const hits = (sr?.query?.search || []).filter(h => {
    const t = norm(h.title).split(" ");
    return words.some(w => t.includes(w));
  });
  const center = city ? await getCityCenter(city) : null;
  for (const hit of hits) {
    const sum = await fetch("https://en.wikipedia.org/api/rest_v1/page/summary/" + encodeURIComponent(hit.title.replace(/ /g, "_")))
      .then(r => r.ok ? r.json() : null);
    if (!sum) continue;
    const ll = sum.coordinates && typeof sum.coordinates.lat === "number" ? { lat: sum.coordinates.lat, lon: sum.coordinates.lon } : null;
    // Stay in the city: near the city centre, or (no GPS point) the text names the city.
    if (city) {
      if (ll && center) { if (km(ll, center) > MAX_KM) continue; }
      else if (!norm(`${sum.extract || ""} ${sum.description || ""}`).includes(norm(city))) continue;
    }
    const out = { desc: shortText(sum.extract, sum.description), url: sum?.content_urls?.mobile?.page || "" };
    if (ll) Object.assign(out, ll);
    return out;
  }

}

const MAX_KM = 50;
function km(a, b) {
  const R = 6371, rad = Math.PI / 180;
  const dLat = (b.lat - a.lat) * rad, dLon = (b.lon - a.lon) * rad;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * rad) * Math.cos(b.lat * rad) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

let rates = null; // USD -> other currencies, from open.er-api.com (free, no key)
async function loadRates() {

    const r = await fetch("https://open.er-api.com/v6/latest/USD");

async function cityGeo(name) {
  // Prefer real places (city, town). Fall back to any match.
  for (const extra of ["&osm_tag=place", ""]) {
    try {
      const r = await fetch("https://photon.komoot.io/api/?limit=1&q=" + encodeURIComponent(name) + extra);
      if (!r.ok) continue;
      const f = (await r.json()).features?.[0];
      if (f) return { lat: f.geometry.coordinates[1], lon: f.geometry.coordinates[0], cc: (f.properties.countrycode || "").toUpperCase() };
    } catch (e) { console.warn("cityGeo failed", name, e); }

function legKey(a, b) { return `${state.mode}|${a.name}|${b.name}`; }

// Inside a city: walk vs public transport (metro / bus), from straight-line distance.
function estimateCityLeg(a, b, cc) {
  const d = km(a, b), street = d * 1.3;
  const tier = TIER_OF[cc] || "mid", [base, perKm] = PRICES[tier].metro;
  const opts = [{ kind: "walk", label: "Walk", min: street / 4.5 * 60, usd: 0 }];
  // Under ~700 m, public transport is not worth it.
  // Metro / subway: walk to station + wait, fast between stations. Bus: short wait, slow in traffic.
  if (d >= 1) opts.push({ kind: "metro", label: "Metro / subway", min: 10 + street / 30 * 60, usd: base + perKm * street });
  if (d >= 0.7) opts.push({ kind: "bus", label: "Bus", min: 7 + street / 15 * 60, usd: (base + perKm * street) * 0.9 });
  opts.sort((x, y) => x.min - y.min);
  return {
    city: true, from: a.name, to: b.name, km: d, options: opts, cur: CUR_OF[cc] || "USD",
    fromQ: placeQ(a, state.city), toQ: placeQ(b, state.city),
    note: d > 25 ? "Far apart: check that both places are in this city." : "",

}
async function buildCityLegs() {
  const ps = state.places;
  if (ps.length < 2) return;
  if (state.city && state.cityCCFor !== state.city) {
    const g = await cityGeo(state.city);
    if (g) { state.cityCC = g.cc; state.cityCCFor = state.city; }
  }
  await loadRates();
  const need = ps.filter(p => typeof p.lat !== "number");
  let i = 0;
  for (const p of need) {
    setStatus(`Finding map points ${++i}/${need.length}…`);
    try { const g = await geocode(p.name, state.city); if (g) Object.assign(p, g); }
    catch (e) { console.warn("geocode failed", p.name, e); }
    if (i < need.length) await new Promise(r => setTimeout(r, 400));
  }
  for (const k of Object.keys(state.legs)) if (k.startsWith("city|")) delete state.legs[k];
  for (let k = 0; k < ps.length - 1; k++) {
    const a = ps[k], b = ps[k + 1];
    state.legs[legKey(a, b)] = (typeof a.lat === "number" && typeof b.lat === "number")
      ? estimateCityLeg(a, b, state.cityCC)
      : { city: true, from: a.name, to: b.name, options: [], error: "Place not found on the map.",
          fromQ: placeQ(a, state.city), toQ: placeQ(b, state.city) };
  }
}

function estimateLeg(a, b) {
  const d = km(a, b); // straight line
  const tierA = TIER_OF[a.cc] || "mid", tierB = TIER_OF[b.cc] || "mid";
  const price = (kind, dist) => {
    const pa = PRICES[tierA][kind], pb = PRICES[tierB][kind];
    return ((pa[0] + pb[0]) / 2) + dist * ((pa[1] + pb[1]) / 2);
  };
  const rail = d * 1.2, road = d * 1.25;
  const cur = CUR_OF[a.cc] || "USD";
  if (d > 2000) {
    return { from: a.name, to: b.name, km: d, options: [], cur,
      note: "Too far for metro, train or bus. A flight is the normal option." };
  }
  const opts = [];
  if (d < 40) opts.push({ kind: "metro", label: "Metro / commuter rail", min: 10 + rail / 40 * 60, usd: price("metro", rail) });
  if (d >= 15) {
    const fast = d >= 150 && HSR.has(a.cc) && HSR.has(b.cc);
    if (fast) opts.push({ kind: "hsr", label: "High-speed train", min: 30 + rail / 200 * 60, usd: price("hsr", rail) });
    opts.push({ kind: "train", label: fast ? "Regular train" : "Train", min: 20 + rail / 70 * 60, usd: price("train", rail) });
  }
  opts.push({ kind: "bus", label: "Bus", min: 15 + road / 60 * 60, usd: price("bus", road) });
  opts.sort((x, y) => x.min - y.min);
  let note = "";
  if (d > 800) note = "Long distance: a flight is often faster and can be cheaper.";
  if (a.cc && b.cc && a.cc !== b.cc) note = (note ? note + " " : "") + "Crosses a border: check that a direct route exists.";
  return { from: a.name, to: b.name, km: d, options: opts, note, cur };
}

async function startTrip() {
  const cs = state.cities;
  if (cs.length < 2) { setStatus("Add at least 2 cities."); return; }
  $("startBtn").disabled = true;
  await loadRates();
  let i = 0, missing = [];
  for (const c of cs) {
    setStatus(`Finding cities ${++i}/${cs.length}…`);
    if (typeof c.lat !== "number" || !c.cc) {
      const g = await cityGeo(c.name);
      if (g) Object.assign(c, g); else missing.push(c.name);
    }
  }
  for (const k of Object.keys(state.legs)) if (k.startsWith("trip|")) delete state.legs[k];
  for (let k = 0; k < cs.length - 1; k++) {
    const a = cs[k], b = cs[k + 1];
    state.legs[legKey(a, b)] = (typeof a.lat === "number" && typeof b.lat === "number")
      ? estimateLeg(a, b)
      : { from: a.name, to: b.name, options: [], error: "City not found. Check the spelling." };
  }
  save(); render();
  setStatus(missing.length ? `Done. Not found: ${missing.join(", ")}.` : "Done.");
  $("startBtn").disabled = false;
}

function fmtTime(min) {

}

}

  const usdTxt = range(lo, hi, "USD");

  const s = stops();
  const u = new URL("https://www.google.com/maps/dir/");
  u.searchParams.set("api", "1");
  u.searchParams.set("origin", s[0]);
  u.searchParams.set("destination", s[s.length - 1]);
  u.searchParams.set("travelmode", mode);
  const mid = s.slice(1, -1);
  if (mid.length && mode !== "transit") u.searchParams.set("waypoints", mid.join("|"));
  return u.toString();
}

// Free geocoding from OpenStreetMap data: Photon first (fuzzy, finds more shops),
// then Nominatim. "bias" = city centre, so results near the city win.
async function photon(q, bias) {
  let url = "https://photon.komoot.io/api/?limit=1&q=" + encodeURIComponent(q);
  if (bias) url += `&lat=${bias.lat}&lon=${bias.lon}`;
  const r = await fetch(url);
  if (!r.ok) return null;
  const f = (await r.json()).features?.[0];
  return f ? { lat: f.geometry.coordinates[1], lon: f.geometry.coordinates[0] } : null;
}
async function nominatim(q) {
  const r = await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&q=" + encodeURIComponent(q));
  if (!r.ok) return null;
  const j = await r.json();
  return j[0] ? { lat: parseFloat(j[0].lat), lon: parseFloat(j[0].lon) } : null;
}
let cityBias = null, cityBiasFor = null;
async function getCityCenter(city) {
  if (cityBiasFor !== city) {
    cityBiasFor = city;
    try { cityBias = await photon(city, null); } catch (e) { cityBias = null; }
    if (!cityBias) cityBiasFor = null; // try again next time
  }
  return cityBias;
}
async function geocode(place, city) {
  const center = city ? await getCityCenter(city) : null;
  const ok = (g) => g && (!center || km(g, center) <= MAX_KM);
  const q = city ? `${place}, ${city}` : place;
  try { const g = await photon(q, center); if (ok(g)) return g; } catch (e) { console.warn("photon failed", q, e); }
  const g = await nominatim(q);
  return ok(g) ? g : null;
}

// ---- Wire up ----
$("addBtn").onclick = () => {
  const lines = $("newPlace").value.split("\n").map(s => s.trim()).filter(Boolean);
  if (!lines.length) return;
  lines.forEach(name => list().push({ name }));
  $("newPlace").value = ""; save(); render(); setStatus("");
};
$("clearBtn").onclick = () => {
  if (list().length && confirm("Remove all?")) { list().length = 0; state.legs = {}; save(); render(); }
};
$("startBtn").onclick = start;
$("mapBtn").onclick = () => {
  if (list().length < 2) { setStatus("Add at least 2 places."); return; }
  if (list().length > 11) setStatus("Note: Google Maps may drop stops after the first 9 waypoints.");
  // Between cities: no walking. Default to transit.
  const walk = $("mode").querySelector('option[value="walking"]');
  walk.hidden = walk.disabled = isTrip();
  if (isTrip() && $("mode").value === "walking") $("mode").value = "transit";
  if (!isTrip() && $("mode").value === "transit") $("mode").value = "walking";
  // 3+ stops: pick one leg (1→2, 2→3, …) or the whole route.
  const items = list(), sel = $("legSel");
  $("legBox").hidden = items.length <= 2;
  if (!$("legBox").hidden) {
    sel.innerHTML = "";
    sel.add(new Option(`Whole route: ${items.map(c => c.name).join(" → ")}`, "all"));
    for (let k = 0; k < items.length - 1; k++) sel.add(new Option(`${k + 1}→${k + 2}: ${items[k].name} → ${items[k + 1].name}`, String(k)));
    // After a one-leg map, offer the next leg.
    const next = state.lastLeg && state.lastLeg.mode === state.mode ? state.lastLeg.k + 1 : -1;
    sel.value = next >= 0 && next < items.length - 1 ? String(next) : "all";
  }
  syncLeg();
  $("mapDlg").showModal();
};
// Transit opens one leg at a time.
function syncLeg() {
  if ($("legBox").hidden) { $("legHint").textContent = ""; return; }
  const mode = $("mode").value, sel = $("legSel");
  const all = sel.options[0];
  all.disabled = mode === "transit";
  if (all.disabled && sel.value === "all") sel.value = "0";
  $("legHint").textContent = mode === "transit" ? "Transit opens one leg at a time. Come back for the next leg." : "";
}
$("mode").addEventListener("change", syncLeg);
$("legSel").addEventListener("change", syncLeg);
// The stops to send to the map: the whole list, or one leg.
function routeItems() {
  if (!$("legBox").hidden && $("legSel").value !== "all") {
    const k = +$("legSel").value;
    return list().slice(k, k + 2);
  }
  return list();
}
function rememberLeg() {
  const v = $("legBox").hidden ? "all" : $("legSel").value;
  state.lastLeg = v === "all" ? null : { mode: state.mode, k: +v };
  save();
}
$("gBtn").onclick = () => { rememberLeg(); location.href = googleUrl($("mode").value); $("mapDlg").close(); };
$("cancelBtn").onclick = () => $("mapDlg").close();

// Home
$("tripBtn").onclick = () => { state.mode = "trip"; save(); go("plan"); };
// City page
CATS.forEach(k => $("newCat").add(new Option(`${CAT_ICON[k]} ${k}`, k)));
$("newCat").value = "Other";
$("cityBack").onclick = () => go("home");
$("cityDel").onclick = () => {
  const n = cityPlaces().length;
  if (!confirm(n ? `Remove ${curCity} and its ${n} saved place(s)?` : `Remove ${curCity}?`)) return;
  favs.places = favs.places.filter(p => !same(p.city, curCity));
  favs.cities = favs.cities.filter(c => !same(c.name, curCity));
  saveFavs(); go("home");
};
let sugTimer = null;
$("newFav").addEventListener("input", () => {
  sugPick = null; clearTimeout(sugTimer);
  const q = $("newFav").value.trim();
  if (q.length < 2) { sugSeq++; $("sug").hidden = true; return; }
  sugTimer = setTimeout(() => suggest(q), 300);
});
$("newFav").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); saveNewFav(); } });
$("newFavBtn").onclick = saveNewFav;
$("pickAll").onclick = () => { shownPlaces().forEach(p => picked.add(pkey(p))); renderCity(); };
$("pickNone").onclick = () => { picked.clear(); renderCity(); };
$("gmapBtn").onclick = () => {
  const ps = chosen(); if (!ps.length) return;
  if (ps.length > 10) cityStatus("Note: Google Maps may drop stops after the first 9 waypoints.");
  window.open(gChosenUrl(ps), "_blank", "noopener");
};
$("routeBtn").onclick = () => {
  const ps = chosen(); if (ps.length < 2) return;
  // Keep earlier lookups for places that were already in the route.
  const old = state.city === curCity ? state.places : [];
  state.mode = "city"; state.city = curCity; state.legs = {};
  state.places = ps.map(f => old.find(p => same(p.name, f.name)) ||
    (typeof f.lat === "number" ? { name: f.name, addr: f.addr, lat: f.lat, lon: f.lon } : { name: f.name }));
  save(); go("plan"); start();
};
// Plan page
$("planBack").onclick = () => (isTrip() || !state.city ? go("home") : go("city", state.city));
window.addEventListener("hashchange", route);

load();
loadFavs();
route();
$("ver").textContent = "v" + APP_VERSION;
console.log("Travel Plan", APP_VERSION);
</script>
